name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    env:
      # SQLite keeps CI dependency-free; the identical schema runs on
      # PostgreSQL in production via scripts/set-db-provider.mjs.
      DATABASE_URL: file:./dev.db
      NODE_ENV: test
      JWT_SECRET: ci-access-secret-not-a-real-key
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Apply the schema
        run: npm run db:push

      - name: Seed the demo data
        run: npm run db:seed

      - name: Typecheck the API
        run: npm run typecheck --workspace server

      - name: Typecheck the client
        run: npm run typecheck --workspace web

      - name: Run the test suite
        run: npm test

      - name: Build both workspaces
        run: npm run build

      - name: Smoke-test the built server
        run: |
          node server/dist/bootstrap.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/api/health > /dev/null; then
              echo "API is healthy"
              curl -s http://127.0.0.1:4000/api/health
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "API never became healthy"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
