<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
  <title id="title">SwiftRoute deployment architecture</title>
  <desc id="desc">React and Express are deployed as one Render web service, backed by PostgreSQL and a notification outbox with console, SMTP, and Twilio transports.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf5ff"/><stop offset=".55" stop-color="#f0f9ff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#334155" flood-opacity=".13"/></filter>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>.t{font:700 27px Inter,Segoe UI,sans-serif;fill:#0f172a}.sub{font:500 14px Inter,Segoe UI,sans-serif;fill:#64748b}.h{font:700 17px Inter,Segoe UI,sans-serif;text-anchor:middle}.p{font:500 13px Inter,Segoe UI,sans-serif;text-anchor:middle}.tag{font:700 11px Inter,Segoe UI,sans-serif;letter-spacing:1px}.arr{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#a3)}</style>
  </defs>
  <rect width="1440" height="540" rx="28" fill="url(#bg3)"/>
  <text x="60" y="54" class="t">Single-service, layered architecture</text><text x="60" y="79" class="sub">One public URL serves the role-aware React app and REST API; durable state lives in PostgreSQL.</text>

  <rect x="45" y="105" width="1000" height="365" rx="24" fill="#fff" fill-opacity=".62" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="70" y="137" class="tag" fill="#7c3aed">RENDER WEB SERVICE · NODE 20</text>
  <path class="arr" d="M300 285H365"/><path class="arr" d="M635 285H700"/>

  <g filter="url(#s3)"><rect x="85" y="190" width="215" height="190" rx="22" fill="#fff" stroke="#c4b5fd" stroke-width="2"/></g>
  <circle cx="192" cy="229" r="25" fill="#ede9fe"/><path d="M179 229h26M192 216v26" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <text x="192" y="276" class="h" fill="#4c1d95">React application</text><text x="192" y="304" class="p" fill="#64748b">customer · agent · admin</text><text x="192" y="327" class="p" fill="#64748b">Vite · Query · Tailwind</text><rect x="122" y="345" width="140" height="24" rx="12" fill="#ede9fe"/><text x="192" y="362" class="p" fill="#6d28d9">served from /</text>

  <g filter="url(#s3)"><rect x="365" y="165" width="270" height="240" rx="22" fill="url(#api)"/></g>
  <text x="500" y="212" class="h" fill="#fff">Express REST API</text><text x="500" y="241" class="p" fill="#e0e7ff">JWT auth · role guards · Zod</text>
  <rect x="397" y="266" width="206" height="50" rx="14" fill="#fff" fill-opacity=".15"/><text x="500" y="287" class="p" fill="#fff">pricing · assignment · orders</text><text x="500" y="306" class="p" fill="#fff">tracking · analytics · users</text>
  <rect x="397" y="330" width="206" height="50" rx="14" fill="#fff" fill-opacity=".15"/><text x="500" y="351" class="p" fill="#fff">transactional business core</text><text x="500" y="370" class="p" fill="#fff">consistent error envelope</text>

  <g filter="url(#s3)"><rect x="700" y="190" width="295" height="190" rx="22" fill="#fff" stroke="#7dd3fc" stroke-width="2"/></g>
  <text x="847" y="228" class="h" fill="#0c4a6e">Prisma data layer</text>
  <rect x="735" y="250" width="225" height="54" rx="14" fill="#e0f2fe"/><text x="847" y="273" class="p" fill="#0369a1">14-model schema</text><text x="847" y="293" class="p" fill="#0369a1">transactions · indexes · constraints</text>
  <rect x="735" y="320" width="225" height="42" rx="14" fill="#dcfce7"/><text x="847" y="346" class="p" fill="#15803d">PostgreSQL in production</text>

  <path class="arr" d="M995 285H1105"/>
  <g filter="url(#s3)"><rect x="1105" y="165" width="275" height="110" rx="20" fill="#fff" stroke="#86efac" stroke-width="2"/></g>
  <text x="1242" y="208" class="h" fill="#14532d">Render PostgreSQL</text><text x="1242" y="235" class="p" fill="#64748b">durable orders · config · audit</text><text x="1242" y="257" class="p" fill="#64748b">same Singapore region</text>

  <path class="arr" d="M995 326H1065V388H1105"/>
  <g filter="url(#s3)"><rect x="1105" y="315" width="275" height="165" rx="20" fill="#fff" stroke="#f0abfc" stroke-width="2"/></g>
  <text x="1242" y="357" class="h" fill="#701a75">Notification outbox</text><text x="1242" y="383" class="p" fill="#64748b">persist first · dispatch after commit</text>
  <rect x="1130" y="408" width="70" height="34" rx="12" fill="#f1f5f9"/><text x="1165" y="430" class="p" fill="#475569">Console</text>
  <rect x="1210" y="408" width="70" height="34" rx="12" fill="#fae8ff"/><text x="1245" y="430" class="p" fill="#a21caf">SMTP</text>
  <rect x="1290" y="408" width="65" height="34" rx="12" fill="#e0f2fe"/><text x="1322" y="430" class="p" fill="#0369a1">Twilio</text>
  <text x="545" y="505" class="sub">Same-origin deployment: no production CORS setup, one cold start, one URL to evaluate.</text>
</svg>
