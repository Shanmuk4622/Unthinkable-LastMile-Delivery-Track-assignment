<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">SwiftRoute order status lifecycle</title>
  <desc id="desc">The guarded shipment state machine from pending to delivered, including failed delivery, reschedule, and reassignment.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#334155" flood-opacity=".12"/></filter>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>.t{font:700 27px Inter,Segoe UI,sans-serif;fill:#0f172a}.sub{font:500 14px Inter,Segoe UI,sans-serif;fill:#64748b}.n{font:700 13px Inter,Segoe UI,sans-serif;text-anchor:middle}.hint{font:500 12px Inter,Segoe UI,sans-serif;fill:#64748b;text-anchor:middle}.arr{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#a2)}</style>
  </defs>
  <rect width="1440" height="420" rx="28" fill="url(#bg2)"/>
  <text x="60" y="54" class="t">Guarded order lifecycle</text><text x="60" y="79" class="sub">Every arrow is role-checked and every accepted transition appends an immutable event.</text>
  <path class="arr" d="M205 160H235"/><path class="arr" d="M375 160H405"/><path class="arr" d="M545 160H575"/><path class="arr" d="M715 160H745"/><path class="arr" d="M885 160H915"/><path class="arr" d="M1055 160H1085"/>
  <g filter="url(#s2)"><rect x="65" y="122" width="140" height="76" rx="16" fill="#f1f5f9" stroke="#94a3b8"/><text x="135" y="165" class="n" fill="#475569">PENDING</text></g>
  <g filter="url(#s2)"><rect x="235" y="122" width="140" height="76" rx="16" fill="#ede9fe" stroke="#8b5cf6"/><text x="305" y="165" class="n" fill="#6d28d9">CONFIRMED</text></g>
  <g filter="url(#s2)"><rect x="405" y="122" width="140" height="76" rx="16" fill="#dbeafe" stroke="#3b82f6"/><text x="475" y="165" class="n" fill="#1d4ed8">ASSIGNED</text></g>
  <g filter="url(#s2)"><rect x="575" y="122" width="140" height="76" rx="16" fill="#cffafe" stroke="#06b6d4"/><text x="645" y="165" class="n" fill="#0e7490">PICKED UP</text></g>
  <g filter="url(#s2)"><rect x="745" y="122" width="140" height="76" rx="16" fill="#e0e7ff" stroke="#6366f1"/><text x="815" y="165" class="n" fill="#4338ca">IN TRANSIT</text></g>
  <g filter="url(#s2)"><rect x="915" y="122" width="140" height="76" rx="16" fill="#fef3c7" stroke="#f59e0b"/><text x="985" y="154" class="n" fill="#b45309">OUT FOR</text><text x="985" y="173" class="n" fill="#b45309">DELIVERY</text></g>
  <g filter="url(#s2)"><rect x="1085" y="122" width="150" height="76" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="1160" y="165" class="n" fill="#15803d">DELIVERED</text></g>
  <circle cx="1280" cy="160" r="27" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><path d="M1268 160l8 8 17-19" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="arr" d="M985 198V252H925"/>
  <g filter="url(#s2)"><rect x="790" y="270" width="200" height="82" rx="16" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2"/><text x="890" y="306" class="n" fill="#be123c">FAILED</text><text x="890" y="329" class="hint">reason required · agent released</text></g>
  <path class="arr" d="M790 311H750"/>
  <g filter="url(#s2)"><rect x="520" y="270" width="230" height="82" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="635" y="306" class="n" fill="#c2410c">RESCHEDULED</text><text x="635" y="329" class="hint">new date and request recorded</text></g>
  <path d="M520 311H475V201" class="arr" stroke="#7c3aed"/>
  <text x="645" y="388" class="hint">Retry returns to ASSIGNED after re-running dispatch and excluding the failed agent.</text>
</svg>
